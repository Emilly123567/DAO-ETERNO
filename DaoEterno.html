<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16110e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dao Eterno</title>
<style>/* ============================================================
   DAO ETERNO · interface
   Laca escura com folha de ouro, jade e o vermelho dos selos.
   Placas do HUD nas bordas; o centro da tela é do mundo.
   ============================================================ */
:root {
  --laca: #16110e;
  --laca2: #211914;
  --laca3: #2d231b;
  --ouro: #d6b05e;
  --ouro2: #f1d99a;
  --selo: #c2412d;
  --jade: #5cc49a;
  --qi: #59c6ff;
  --papel: #efe5cf;
  --nevoa: #a6998a;
  --fio: rgba(214, 176, 94, 0.32);
  --fio2: rgba(214, 176, 94, 0.14);
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sb: env(safe-area-inset-bottom, 0px);
  --st: env(safe-area-inset-top, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0908; color: var(--papel); font: 13px/1.4 var(--sans); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ouro2); outline-offset: 2px; }
.hid { display: none !important; }
#jogo { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; image-rendering: pixelated; }

/* ---------- placas do HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
.placa, #status, #track, #hPedras, #bussola {
  background: linear-gradient(180deg, rgba(33, 25, 20, 0.9), rgba(22, 17, 14, 0.88));
  border: 1px solid var(--fio); border-radius: 6px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5), 0 2px 10px rgba(0, 0, 0, 0.35);
}
#status { position: absolute; left: calc(10px + var(--sl)); top: calc(10px + var(--st)); width: 300px; padding: 8px 10px 7px; }
#status .l1 { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 22px; }
#hRank { font: 600 15px/1.2 var(--serif); letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hAvanco { pointer-events: auto; border: 1px solid var(--ouro); background: linear-gradient(180deg, #e8c46a, #b88a32); color: #1a120a; font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 4px; animation: pulso 1.2s ease-in-out infinite; white-space: nowrap; }
#hAvanco.trib { background: linear-gradient(180deg, #b49aff, #6a4ad0); color: #fff; border-color: #d8ccff; }
@keyframes pulso { 50% { box-shadow: 0 0 0 4px rgba(241, 217, 154, 0.25), 0 0 14px rgba(241, 217, 154, 0.55); } }
.bar { position: relative; height: 14px; margin-top: 5px; background: #0d0a08; border: 1px solid rgba(214, 176, 94, 0.25); border-radius: 3px; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width 0.18s linear; }
.bar span { position: relative; display: block; padding: 0 6px; font-size: 10.5px; line-height: 13px; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 1px 1px #000, 0 0 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar.qi i { background: linear-gradient(90deg, #1667b8, #3fa8f0 60%, #9be6ff); }
.bar.hp i { background: linear-gradient(90deg, #8a1c16, #d2402e 70%, #ff7a5c); }
.bar.en { height: 5px; margin-top: 4px; }
.bar.en i { background: linear-gradient(90deg, #2a8a62, var(--jade)); }
#hInfo { margin-top: 5px; color: var(--nevoa); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#topoDir { position: absolute; right: calc(10px + var(--sr)); top: calc(10px + var(--st)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#hPedras { display: flex; gap: 10px; align-items: center; padding: 5px 10px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hPedras small { font-weight: 400; color: var(--nevoa); font-size: 10.5px; }
#hPedras .hon { color: var(--ouro2); }
#hPedras .fra { color: #e0c8ff; }
#menu { display: flex; gap: 4px; }
#menu button, #acoes button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  width: 54px; height: 50px; padding: 0; border-radius: 6px;
  background: linear-gradient(180deg, rgba(45, 35, 27, 0.94), rgba(22, 17, 14, 0.94));
  border: 1px solid var(--fio); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.55);
}
#menu button span, #acoes button span { font-size: 19px; line-height: 1; }
#menu small, #acoes small { font-size: 10px; color: var(--ouro2); opacity: 0.85; }
#menu button:hover, #acoes button:hover { border-color: var(--ouro); }
#menu button:active, #acoes button:active { transform: translateY(1px); }

#track { position: absolute; left: calc(10px + var(--sl)); top: calc(118px + var(--st)); width: 300px; padding: 6px 10px; pointer-events: none; }
#track:empty { display: none; }
#track div { padding: 3px 0; border-top: 1px solid var(--fio2); }
#track div:first-child { border-top: 0; }
#track b { display: block; font: 600 12.5px/1.25 var(--serif); color: var(--ouro2); }
#track span { display: block; font-size: 11.5px; color: var(--papel); opacity: 0.88; }

#bussola { position: absolute; left: 50%; top: calc(10px + var(--st)); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 6px; pointer-events: none; max-width: 46vw; }
#bussola i { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; font-style: normal; color: #ffd040; font-size: 17px; text-shadow: 0 0 6px rgba(255, 200, 60, 0.7); }
#bussola span { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#log { position: absolute; left: calc(10px + var(--sl)); bottom: calc(12px + var(--sb)); width: 380px; pointer-events: none; display: flex; flex-direction: column-reverse; gap: 2px; }
#log div { font-size: 12px; padding: 2px 8px; border-radius: 3px; background: rgba(14, 10, 8, 0.62); text-shadow: 0 1px 1px #000; width: fit-content; max-width: 100%; }
#log div:nth-child(n+4) { opacity: 0.6; }
.m-sys { color: #e6dcc8; } .m-gain { color: #9fe8a8; } .m-combat { color: #ff9a86; } .m-divine { color: #f4d77e; } .m-boss { color: #ff7ad0; }

/* ---------- técnicas ---------- */
#skills { position: absolute; left: 50%; bottom: calc(12px + var(--sb)); transform: translateX(-50%); display: flex; gap: 5px; }
.sk { position: relative; width: 56px; height: 56px; padding: 0; border-radius: 6px; overflow: hidden; background: linear-gradient(180deg, rgba(45, 35, 27, 0.95), rgba(18, 14, 11, 0.95)); border: 1.5px solid var(--fio); }
.sk i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0, 0, 0, 0.66); }
.sk small { position: absolute; left: 4px; top: 2px; font-size: 10px; color: var(--ouro2); }
.sk em { position: absolute; left: 0; right: 0; top: 9px; text-align: center; font: normal 21px/1 var(--serif); text-shadow: 0 0 6px rgba(0,0,0,0.9); }
.sk b { position: absolute; left: 2px; right: 2px; bottom: 4px; font: 600 10.5px/1.1 var(--serif); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk.sup { border-color: var(--ouro); box-shadow: 0 0 8px rgba(241, 217, 154, 0.35) inset; }
.sk.vazio { border-style: dashed; opacity: 0.5; }
.sk.semEn b { opacity: 0.4; }

/* ---------- ações ---------- */
#acoes { position: absolute; right: calc(12px + var(--sr)); bottom: calc(12px + var(--sb)); display: flex; gap: 5px; align-items: flex-end; }
#acoes button.on { border-color: var(--jade); box-shadow: 0 0 0 1px var(--jade), 0 0 12px rgba(92, 196, 154, 0.45); }
#bInter { position: absolute; right: 0; bottom: 60px; width: auto !important; height: 40px !important; flex-direction: row !important; padding: 0 14px !important; font: 600 13px var(--serif); white-space: nowrap; color: var(--ouro2); border-color: var(--ouro) !important; animation: pulso 1.6s infinite; }

#joy { position: fixed; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; border: 2px solid rgba(241, 217, 154, 0.35); background: radial-gradient(circle, rgba(241, 217, 154, 0.1), rgba(0, 0, 0, 0.12)); opacity: 0; pointer-events: none; transition: opacity 0.12s; left: 0; top: 0; }
#joy.on { opacity: 1; }
#joy i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f1d99a, #b88a32); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }

/* ---------- avisos ---------- */
#toasts { position: fixed; left: 50%; top: calc(52px + var(--st)); transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; width: min(560px, 92vw); }
.toast { background: rgba(22, 17, 14, 0.94); border: 1px solid var(--fio); border-radius: 5px; padding: 6px 14px; font-size: 13px; text-align: center; transition: opacity 0.5s, transform 0.5s; animation: entra 0.2s ease-out; }
.toast.sai { opacity: 0; transform: translateY(-6px); }
@keyframes entra { from { opacity: 0; transform: translateY(-6px); } }
#flut { position: fixed; left: 50%; top: 42%; z-index: 15; pointer-events: none; }
.flut { position: absolute; left: 0; transform: translateX(-50%); white-space: nowrap; font: 700 14px var(--serif); color: var(--ouro2); text-shadow: 0 1px 2px #000, 0 0 4px #000; animation: sobe 1.6s ease-out forwards; }
@keyframes sobe { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -60px); } }
#banner { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 25; pointer-events: none; text-align: center; width: min(640px, 92vw); animation: banner 4.2s ease forwards; }
#banner h2 { margin: 0; font: 600 clamp(24px, 4.4vw, 40px)/1.15 var(--serif); color: var(--ouro2); text-shadow: 0 2px 0 #000, 0 0 18px rgba(214, 176, 94, 0.55); }
#banner p { margin: 8px auto 0; max-width: 520px; font: italic 15px/1.45 var(--serif); color: var(--papel); text-shadow: 0 1px 2px #000, 0 0 6px #000; }
#banner::before, #banner::after { content: ''; display: block; height: 1px; margin: 10px auto; width: 60%; background: linear-gradient(90deg, transparent, var(--ouro), transparent); }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, 8px); } 10%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
#cortina { position: fixed; inset: 0; z-index: 60; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.6s; display: flex; align-items: center; justify-content: center; font: italic 20px var(--serif); color: var(--ouro2); }
#cortina.on { opacity: 1; pointer-events: auto; }

/* ---------- painel ---------- */
#painel {
  position: fixed; z-index: 40; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(760px, 94vw); max-height: 86vh; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #221a15, #15100d); color: var(--papel);
  border: 1px solid var(--ouro); border-radius: 10px;
  box-shadow: inset 0 0 0 3px #15100d, inset 0 0 0 4px var(--fio), 0 18px 60px rgba(0, 0, 0, 0.65);
  -webkit-user-select: text; user-select: text;
}
#painel.peq { width: min(560px, 94vw); top: auto; bottom: calc(84px + var(--sb)); transform: translateX(-50%); max-height: 62vh; }
.mapabar { justify-content: center; margin: 0 0 8px; }
.ph { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px 16px; }
.ph h3 { margin: 0; font: 600 19px/1.2 var(--serif); color: var(--ouro2); display: flex; align-items: center; gap: 10px; }
.ph h3::before { content: '道'; display: inline-grid; place-items: center; width: 24px; height: 24px; font: 700 15px/1 var(--serif); color: #fff3e0; background: var(--selo); border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
.x { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--fio); background: transparent; color: var(--ouro2); font-size: 15px; }
.x:hover { background: var(--laca3); }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--fio); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { background: none; border: 0; padding: 8px 11px 9px; color: var(--nevoa); font: 600 13.5px var(--serif); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ouro2); border-bottom-color: var(--ouro); }
.pc { padding: 12px 16px 16px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.pc p { margin: 6px 0; }
.card { background: rgba(0, 0, 0, 0.22); border: 1px solid var(--fio2); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
.tit { font: 600 14.5px/1.3 var(--serif); color: var(--ouro2); margin-bottom: 4px; }
.sub { color: var(--nevoa); font-size: 12px; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 0; border-bottom: 1px dotted rgba(214, 176, 94, 0.12); }
.kv:last-child { border-bottom: 0; }
.kv b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; margin-bottom: 4px; border-radius: 5px; background: rgba(255, 255, 255, 0.025); border-left: 2px solid transparent; }
.item > div:first-child { min-width: 0; flex: 1 1 200px; }
.item > span:last-child, .item > button:last-child { flex-shrink: 0; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.item.ok { border-left-color: var(--jade); background: rgba(92, 196, 154, 0.06); }
.item.off { opacity: 0.55; }
.row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
.tag { display: inline-block; font-size: 10.5px; padding: 0 5px; border: 1px solid; border-radius: 3px; line-height: 15px; white-space: nowrap; vertical-align: 1px; }
.pos { color: #8fe0a6; } .neg { color: #ff8a76; }
.pd { white-space: nowrap; font-variant-numeric: tabular-nums; }
.falatxt { font: 15px/1.6 var(--serif); color: var(--papel); }
.dica { border-left: 2px solid var(--ouro); padding: 4px 10px; background: rgba(214, 176, 94, 0.07); color: var(--ouro2); font-size: 12.5px; border-radius: 0 4px 4px 0; }
.lg { padding: 3px 0; border-bottom: 1px dotted rgba(214, 176, 94, 0.1); font-size: 12.5px; }
.b { border: 1px solid var(--fio); background: linear-gradient(180deg, #33281f, #221a14); color: var(--papel); padding: 7px 13px; border-radius: 5px; font-size: 13px; line-height: 1.2; }
.b:hover:not(:disabled) { border-color: var(--ouro); }
.b:disabled { opacity: 0.42; cursor: not-allowed; }
.b.pri { background: linear-gradient(180deg, #e3bf68, #b4872f); color: #1d140a; border-color: #f1d99a; font-weight: 700; }
.b.neg { border-color: rgba(194, 65, 45, 0.7); color: #ffb2a4; }
.b.ok, .b.on { border-color: var(--jade); color: #b8f0d6; background: linear-gradient(180deg, #24392f, #18251f); }
.b.mini { padding: 4px 8px; font-size: 12px; }
.b.grande { padding: 11px 18px; font-size: 15px; }
.b.brilho { animation: pulso 1.2s infinite; }
.slots6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px; }
.slot6 { text-align: center; padding: 8px 4px; border: 1px dashed var(--fio); border-radius: 6px; font-size: 18px; }
.slot6.ok { border-style: solid; border-color: var(--jade); }
.slot6 small { display: block; font-size: 10px; color: var(--nevoa); margin-top: 3px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slots8 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin: 8px 0 12px; }
.sl { min-height: 58px; padding: 4px 3px; border-radius: 6px; border: 1px solid var(--fio); background: rgba(0, 0, 0, 0.25); font: 600 10.5px/1.15 var(--serif); color: var(--papel); }
.sl small { display: block; color: var(--ouro2); font: 10px var(--sans); margin-bottom: 2px; }
.sl.sel { border-color: var(--ouro2); box-shadow: 0 0 0 1px var(--ouro2); background: rgba(214, 176, 94, 0.12); }
.sl.sup { border-color: var(--ouro); }
.mapawrap { display: flex; justify-content: center; }
#mapcv { image-rendering: pixelated; border: 1px solid var(--fio); border-radius: 4px; background: #05050a; max-width: 100%; }
.leg { text-align: center; color: var(--nevoa); font-size: 11.5px; margin-top: 6px; }
.campo { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; border-radius: 5px; border: 1px solid var(--fio); background: rgba(0, 0, 0, 0.35); color: var(--papel); font: 15px var(--sans); -webkit-user-select: text; user-select: text; }
.campo:focus { border-color: var(--ouro); outline: none; }

/* ---------- telas iniciais ---------- */
.tela { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; padding: 24px; padding-left: calc(6vw + var(--sl)); pointer-events: none; background: linear-gradient(90deg, rgba(11, 9, 8, 0.86) 0%, rgba(11, 9, 8, 0.55) 34%, rgba(11, 9, 8, 0) 62%); }
.cartao { pointer-events: auto; width: min(400px, 100%); max-height: calc(100vh - 48px); overflow-y: auto; padding: 26px 26px 20px; background: linear-gradient(180deg, rgba(34, 26, 21, 0.95), rgba(20, 15, 12, 0.95)); border: 1px solid var(--ouro); border-radius: 10px; box-shadow: inset 0 0 0 3px #15100d, inset 0 0 0 4px var(--fio), 0 20px 70px rgba(0, 0, 0, 0.6); }
.selo { width: 58px; height: 58px; display: grid; place-items: center; background: var(--selo); color: #fff4e4; font: 700 34px/1 var(--serif); border-radius: 6px; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.22), 0 4px 16px rgba(194, 65, 45, 0.4); transform: rotate(-3deg); }
.cartao h1 { margin: 14px 0 0; font: 600 40px/1.05 var(--serif); color: var(--ouro2); letter-spacing: 0.01em; }
.cartao h2 { margin: 0 0 10px; font: 600 26px/1.1 var(--serif); color: var(--ouro2); }
.lema { margin: 4px 0 18px; font: italic 15px var(--serif); color: var(--nevoa); }
.cartao label { display: block; margin-bottom: 12px; color: var(--ouro2); font: 600 13px var(--serif); }
.cartao .grande { width: 100%; margin-top: 4px; }
.cartao .row .grande { width: auto; flex: 1; }
.msg { min-height: 18px; color: #ff9a86; font-size: 12.5px; margin: 8px 0 0; }
#lContas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
#lContas .sub { width: 100%; margin: 4px 0 0; }
.conta { display: flex; flex-direction: column; align-items: flex-start; padding: 6px 10px; border-radius: 5px; border: 1px solid var(--fio); background: rgba(0, 0, 0, 0.25); text-align: left; }
.conta b { font: 600 13px var(--serif); color: var(--papel); }
.conta small { color: var(--nevoa); font-size: 10.5px; }
.opc { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; margin: 8px 0; }
.opc > span { color: var(--ouro2); font: 600 13px var(--serif); }
.opc .row { margin: 0; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(0, 0, 0, 0.5); padding: 0; box-shadow: 0 0 0 1px var(--fio); }
.sw.on { box-shadow: 0 0 0 2px var(--ouro2); }
.destino { margin: 14px 0; padding: 16px; text-align: center; border-radius: 8px; border: 1px solid var(--c); background: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%); }
.destino small { display: block; color: var(--nevoa); font-size: 12px; }
.destino b { display: block; margin: 4px 0; font: 600 26px/1.15 var(--serif); color: var(--c); text-shadow: 0 0 14px color-mix(in srgb, var(--c) 50%, transparent); }
.destino span { color: var(--papel); font-size: 13px; }
#cDestino .b.pri { width: 100%; margin-top: 14px; }

/* ---------- PC: ações com legenda de tecla ---------- */
@media (pointer: fine) {
  #acoes button { width: 58px; }
}

/* ---------- toque: botões grandes de combate em arco ---------- */
@media (pointer: coarse) {
  #acoes { width: 228px; height: 196px; display: block; }
  #acoes button { position: absolute; width: 50px; height: 50px; border-radius: 50%; }
  #acoes small { display: none; }
  #bAtk { right: 0; bottom: 0; width: 82px !important; height: 82px !important; background: radial-gradient(circle at 40% 30%, #4a3628, #1e1611) !important; border: 2px solid var(--ouro) !important; }
  #bAtk span { font-size: 34px !important; }
  #bDash { right: 92px; bottom: 2px; }
  #bMed { right: 86px; bottom: 62px; }

<script>// ===== base.js =====
/* ============================================================
   BASE: sorte com semente, ruído, utilidades, NÚMEROS GRANDES
   (guardados como log10, chegam a 1e4573636738276378375628863663773637736) e o
   sistema próprio de abreviações do Dao Eterno.
   ============================================================ */
'use strict';
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hash2(x, y, s) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 2147483647); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function mulberry(seed) {
  let a = seed >>> 0;
  return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
// gerador de sorte do jogo (combate, quedas, eventos)
const R = {
  f: () => Math.random(),
  i: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  ch: (p) => Math.random() < p,
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  pickW(arr, w) { let t = 0; for (const x of arr) t += w(x); let r = Math.random() * t; for (const x of arr) { r -= w(x); if (r <= 0) return x; } return arr[arr.length - 1]; },
};
// gerador determinístico (conteúdo e mapa são iguais para todos)
function Rs(seed) {
  const n = mulberry(seed);
  return { f: n, i: (a, b) => a + Math.floor(n() * (b - a + 1)), ch: (p) => n() < p, pick: (arr) => arr[Math.floor(n() * arr.length)], sh(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(n() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; } };
}
function makeNoise(seed) {
  const rnd = (x, y) => hash2(x, y, seed);
  const sm = (t) => t * t * (3 - 2 * t);
  function v(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const a = rnd(xi, yi), b = rnd(xi + 1, yi), c = rnd(xi, yi + 1), d = rnd(xi + 1, yi + 1);
    const u = sm(xf), w = sm(yf);
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  }
  return function fbm(x, y, oct) { let s = 0, amp = 0.5, f = 1, n = 0; for (let o = 0; o < (oct || 4); o++) { s += v(x * f, y * f) * amp; n += amp; amp *= 0.5; f *= 2; } return s / n; };
}
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const escH = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const $ = (q) => document.querySelector(q);

// ============================================================
//  NÚMEROS GRANDES: um valor é guardado como seu log10.
//  0 = -Infinity. Multiplicar = somar. Teto mostrado: 1e4573636738276378375628863663773637736.
// ============================================================
const N = {
  Z: -Infinity,
  MAX: 1e14, // teto interno (log10); a tela mostra até 1e4573636738276378375628863663773637736
  of: (x) => (x > 0 ? Math.log10(x) : -Infinity),
  add(a, b) { if (a === -Infinity) return b; if (b === -Infinity) return a; const m = a > b ? a : b, d = (a > b ? b : a) - m; return d < -17 ? m : m + Math.log10(1 + Math.pow(10, d)); },
  sub(a, b) { if (b === -Infinity) return a; if (b >= a) return -Infinity; const d = b - a; return d < -17 ? a : a + Math.log10(1 - Math.pow(10, d)); },
  mul: (a, b) => a + b,
  div: (a, b) => a - b,
  sc: (a, x) => (x > 0 ? a + Math.log10(x) : -Infinity), // multiplica por número comum
  ge: (a, b) => a >= b - 1e-7 * Math.max(1, Math.abs(b) * 1e-6),
  max: (a, b) => (a > b ? a : b),
  min: (a, b) => (a < b ? a : b),
  val: (a) => Math.pow(10, a), // volta para número comum (só para valores pequenos)
  frac: (a, b) => (b === -Infinity ? 1 : clamp(Math.pow(10, Math.max(-30, a - b)), 0, 1)), // a/b entre 0 e 1
  cap: (a) => Math.min(a, N.MAX),

// ============================================================
//  ABREVIAÇÕES PRÓPRIAS
//  k M B T Qa Qi Sx Sp Oc No, depois Dc UDc DDc ... Vg Tg ... Ce,
//  e acima de 1e3003 grupos com Mi (mil), Mc (milhão), Na (bilhão):
//  1e78354764 = "100 SxVgMc·OcDcCeMi·TQigDce"
// ============================================================
const Fmt = {
  modo: 'abrev',
  BAS: ['', 'k', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No'],
  U: ['', 'U', 'D', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No'],
  D: ['', 'Dc', 'Vg', 'Tg', 'Qag', 'Qig', 'Sxg', 'Spg', 'Ocg', 'Nog'],
  C: ['', 'Ce', 'Dce', 'Tce', 'Qace', 'Qice', 'Sxce', 'Spce', 'Occe', 'Noce'],
  TIER: ['', 'Mi', 'Mc', 'Na', 'Pc', 'Fm', 'At', 'Zp', 'Yc', 'Xn', 'Vc', 'Mec', 'Duec', 'Trec', 'Tetc'],
  TETO: 4573636738276378375628863663773637736n,
  peq(g) { return Fmt.U[g % 10] + Fmt.D[Math.floor(g / 10) % 10] + Fmt.C[Math.floor(g / 100) % 10]; },
  // nome do "-ilhão" de índice n (1 = milhão)
  ilhao(n) {
    if (n < 10) return Fmt.BAS[n + 1];
    if (n < 1000) return Fmt.peq(n);
    const g = []; let m = n; while (m > 0) { g.push(m % 1000); m = Math.floor(m / 1000); }
    const out = [];
    for (let k = g.length - 1; k >= 0; k--) { if (!g[k]) continue; out.push((g[k] === 1 && k > 0 ? '' : Fmt.peq(g[k])) + Fmt.TIER[k]); }
    return out.join('·');
  },
  sufixo(i) { return i <= 10 ? Fmt.BAS[i] : Fmt.ilhao(i - 1); }, // i = grupo de 3 dígitos
  // nome de -ilhão com índice gigante (BigInt): grupos de 3 dígitos com Mi, Mc, Na, Pc, Fm, At, Zp, Yc, Xn, Vc, Mec, Duec, Trec
  ilhaoBig(n) {
    const g = []; let m = n; while (m > 0n) { g.push(Number(m % 1000n)); m /= 1000n; }
    const out = []; for (let k = g.length - 1; k >= 0; k--) { if (!g[k]) continue; out.push((g[k] === 1 && k > 0 ? '' : Fmt.peq(g[k])) + (k < Fmt.TIER.length ? Fmt.TIER[k] : 'T' + k)); }
    return out.join('·');
  },
  // acima de 1e12 o expoente interno (que o computador guarda com precisão) é esticado até o teto mostrado
  gigante(l) {
    const lt = Math.log10(l), top = Math.log10(4.573636738276378e36);
    if (l >= N.MAX - 1e-3) return { e: Fmt.TETO, m: 1 };
    const le = 12 + (lt - 12) * (top - 12) / (Math.log10(N.MAX) - 12), x = Math.pow(10, le);
    return { e: BigInt(Math.floor(x)), m: Math.pow(10, x % 1) };
  },
  L(l, dec) {
    if (l === -Infinity || l !== l) return '0';
    if (l === Infinity) return '∞';
    if (l > 1e12) {
      const G = Fmt.gigante(l);

      const i = G.e / 3n, r = Number(G.e % 3n), m = G.m * Math.pow(10, r);
      return (m >= 100 ? m.toFixed(0) : m >= 10 ? m.toFixed(1) : m.toFixed(2)) + ' ' + Fmt.ilhaoBig(i - 1n);
    }
    if (l < 3) { const v = Math.pow(10, l); if (dec === 0 || v >= 100) return String(Math.floor(v + 1e-9)); return (Math.round(v * 100) / 100).toString(); }
    if (Fmt.modo === 'cient') { const e = Math.floor(l + 1e-12), m = Math.pow(10, l - e); return m.toFixed(2) + 'e' + (e >= 1e6 ? e.toLocaleString('pt-BR') : e); }
    const i = Math.floor(l / 3 + 1e-12), m = Math.pow(10, l - i * 3);
    const ms = m >= 100 ? m.toFixed(0) : m >= 10 ? m.toFixed(1) : m.toFixed(2);

    return ms + (suf.length > 3 ? ' ' : '') + suf;
  },
  n(x, dec) { return Fmt.L(N.of(x), dec); }, // número comum
  pct(x) { return (x >= 10 ? Math.round(x) : Math.round(x * 10) / 10) + '%'; },
  x(m) { return '×' + (m >= 1000 ? Fmt.n(m) : m >= 10 ? m.toFixed(0) : m >= 2 ? m.toFixed(1) : m.toFixed(2)); },
  t(s) {
    s = Math.max(0, Math.round(s));
    if (s < 60) return s + 's';

    return Math.floor(s / 86400) + 'd ' + Math.floor(s / 3600) % 24 + 'h';
  },
  anos(a) { if (a === Infinity) return 'eterna'; if (a >= 1e6) return Fmt.n(a) + ' anos'; if (a < 1) return a <= 0 ? '0 ano' : Math.max(1, Math.round(a * 12)) + (Math.round(a * 12) === 1 ? ' mês' : ' meses'); if (a < 10 && a % 1 > 0.05) return a.toFixed(1).replace('.', ',') + ' anos'; const n = Math.floor(a); return n.toLocaleString('pt-BR') + (n === 1 ? ' ano' : ' anos'); },
  cient(l) { if (l === -Infinity) return '0'; const e = Math.floor(l + 1e-12); return Math.pow(10, l - e).toFixed(2) + 'e' + e.toLocaleString('pt-BR'); },
};

    g.putImageData(img, 0, 0);
    mapaImg = c; return c;
  }
  return { init, reset, resize, frame, cam, camadas, mapa, tremor: (v) => { treme = Math.max(treme, v); }, get dpr() { return dpr; }, tela: (wx, wy) => { const z = cam.z * dpr; return [((wx - cam.x) * z + cv.width / 2) / dpr, ((wy - cam.y) * z + cv.height / 2) / dpr]; }, mundo: (sx, sy) => { const z = cam.z; return [cam.x + (sx - innerWidth / 2) / z, cam.y + (sy - innerHeight / 2) / z]; } };
})();

// ===== jogo.js =====
/* ============================================================
   NÚCLEO: tempo, o cultivador (estado salvo), fórmulas de Qi e
   de combate (em log10), avanço de estágio e de reino, corpo e
   alma, idade e expectativa de vida, reclusão, ganhos offline,
   movimento no mapa e interações.
   ============================================================ */
// ---------- tempo ----------
// relógio do mundo (dia/noite, ervas, chefes): 6 minutos por segundo real
// calendário (idade): 1 ano a cada 10 minutos reais
const MIN_ANO = 525600, SEG_ANO = 600;
const Tempo = {
  min: 8 * 60, cal: 0,
  passo(dt) { Tempo.min += dt * 6; Tempo.cal += dt * MIN_ANO / SEG_ANO; },
  agora: () => Tempo.min,
  hora: () => (Tempo.min / 60) % 24,
  dia: () => Math.floor(Tempo.min / 1440),
  ano: () => Tempo.cal / MIN_ANO,
  data() { const a = Tempo.ano(), ano = Math.floor(a) + 1, mes = Math.floor((a % 1) * 12) + 1; return 'Ano ' + ano + ', mês ' + mes + ' · ' + String(Math.floor(Tempo.hora())).padStart(2, '0') + ':' + String(Math.floor(Tempo.min % 60)).padStart(2, '0'); },
};
// tempo do jogo (anos) em texto
const tempoJogo = (seg) => { const anos = seg / SEG_ANO; if (anos < 1 / 12) return Math.max(1, Math.round(anos * 365)) + ' dias'; if (anos < 1) return Math.round(anos * 12) + ' meses'; return Fmt.anos(anos); };

// ---------- curvas ----------
// Cada estágio exige 30× o anterior. Entre reinos há um salto extra X(r) que
// cresce até o teto no DAO ETERNO Pico (na tela: 1e4573636738276378375628863663773637736).
// Tempo por estágio sem raiz: 8 meses do jogo (400 s reais) no primeiro reino, ×1,5 a cada reino.
const LOG30 = Math.log10(30);
const Curva = (() => {
  const X49 = N.MAX - 2 - 499 * LOG30;
  let lo = 0.05, hi = 2;
  for (let i = 0; i < 200; i++) { const B = (lo + hi) / 2, r = (Math.exp(10 * B) - 1) / (Math.exp(49 * B) - 1); if (r > 30 / X49) lo = B; else hi = B; }
  const B = (lo + hi) / 2, A = 30 / (Math.exp(10 * B) - 1);
  const X = (r) => (r >= 49 ? X49 : A * (Math.exp(B * r) - 1));
  const E = new Float64Array(501); for (let s = 0; s <= 500; s++) E[s] = s >= 499 ? N.MAX : 2 + s * LOG30 + X(Math.floor(s / 10));
  return {
    E: (s) => E[clamp(s, 0, 500)],
    T: (s) => Math.log10(400) + Math.floor(s / 10) * Math.log10(1.5), // log10 dos segundos reais por estágio, sem raiz e sem ajuda
    C: (s) => 1 + 0.06 * s + 3 * reinoDeRank(rankDe(s)), // escala de combate
  };
})();
// a raiz espiritual não multiplica o Qi: ela encurta o tempo
const RAIZ = (mult) => (mult >= 80 ? ['Divina', 'nanossegundo', '#ff80ab'] : mult >= 20 ? ['Extraordinária', 'milissegundo', '#ffd54f'] : mult >= 5 ? ['Mediana', 'segundo', '#9ae0ff'] : mult > 1 ? ['Baixa', 'minuto', '#b0a898'] : ['Sem raiz', 'minuto', '#8a8478']);

// ---------- estado do cultivador ----------
let P = null;
function novoJogador(nome, sexo, look) {
  const roll = Math.random();
  let destino = Math.floor(Math.random() * 14);
  if (roll < 0.005) destino = 15; else if (roll < 0.02) destino = 14;
  return {
    v: 1, nome, sexo, look, destino, el: ELEM5[Math.floor(Math.random() * 5)], aptidao: +(0.9 + Math.random() * 0.3).toFixed(2),
    passo: 0, qi: N.Z, corpo: 0, alma: 0, hp: null, en: 100,
    pedras: new Array(NIVEIS).fill(0), honra: 0, honraTotal: 0, pa: 0, frags: 0, daoExp: 0, daoNv: 1,
    aspectos: {}, merid: [], lend: [], man: {}, metodo: null, ativos: {}, slots: new Array(8).fill(null),
    mats: [], form: { principal: null, aux: [null, null] }, formXp: 0, alqXp: 0, forjaXp: 0,
    daos: {}, rios: {}, equips: [], eq: {}, inv: {}, pet: null,
    seita: { id: 0, rank: 0 }, locUp: {}, matrizNv: 0, buffs: [], pilRes: {}, qiBonus: 0, permQi: 1, vidaMult: 1, ferido: 0, avanco: 0,
    nasc: Tempo.cal - 18 * MIN_ANO, base: 0, baseP: 0, construidas: [], reino: 0, pos: null, tele: [],
    mundo: [0, 1, 2, 3].map(() => ({ fog: {}, node: {}, chefe: {}, ruina: {}, masm: {} })),
    miss: { ativas: [], hist: 0, flags: {}, cdSeita: 0, cdBoard: 0, prox: 1 }, conq: [], st: { chefes: 0, pilulas: 0, masmorras: 0, mundiais: 0, missoes: 0, morte: 0, duelos: 0, abates: 0, mortes: 0 },
    regVis: [], autoAv: false, cfg: { notacao: 'abrev', joyInvis: false, qualidade: 'auto' }, ultimo: Date.now(), tempo: Tempo.min, cal: Tempo.cal,
  };
}

// ---------- atributos derivados ----------
const Stats = {
  rank: () => rankDe(P.passo), estagio: () => estagioDe(P.passo), reino: () => reinoDeRank(rankDe(P.passo)),
  qiMax: () => Curva.E(P.passo),
  nivelL() { const g = regiaoDoRank(rankDe(P.passo)); return g ? g.L : 0; },
  // fator de eficiência do cultivo, com a lista do que entra nele
  F(detalhe) {
    const L = [];
    const m = (nome, v) => { if (v !== 1) L.push([nome, v]); return v; };
    let f = 1;
    const loc = Jogo.localAqui();
    if (loc) { const fl = loc.f * (1 + 0.1 * (P.locUp[loc.id] || 0)); f *= m('Local: ' + loc.nome, fl); if (loc.el && loc.el === P.el) f *= m('Afinidade de elemento', 1.5); }
    if (P.metodo !== null && MANUAIS[P.metodo]) { const mm = MANUAIS[P.metodo], ms = (P.man[P.metodo] || {}).m || 0; f *= m('Método: ' + mm.nome, mm.f * MAESTRIA_MULT[ms] * (mm.el === P.el ? 1.25 : 1) * Stats.efic(mm.L)); }
    let lend = 1; for (const i of P.lend) lend *= TECNICAS_LEND[i].f; f *= m('Técnicas lendárias', lend);
    let mq = 1, ma = 1; for (const i of P.merid) { const M = MERIDIANOS[i]; if (M.bonus === 'qi') mq += M.val; if (M.bonus === 'all') ma += M.val; } f *= m('Meridianos', mq * ma);
    const fm = Formacao.ativa('cultivo'); if (fm) f *= m('Matriz: ' + fm.m.nome, fm.mult * Stats.efic(fm.m.L));
    f *= m('Equipamentos', Stats.eqMult('qi') * Stats.eqMult('all'));
    f *= m('Pílulas', Stats.buff('qi') * Stats.buff('all'));
    f *= m('Aspectos do Dao', (1 + 0.2 * (P.aspectos[0] || 0)) * (1 + 0.1 * (P.aspectos[5] || 0)));
    f *= m('Nível do Dao', 1 + (P.daoNv - 1) * 0.1);
    if (P.pet && ['qi', 'all'].includes(PETS[P.pet.id].bonus)) f *= m('Besta companheira', 1.2 + 0.05 * P.pet.nv);
    f *= m('Itens de ascensão', 1 + Stats.asc('qi') + Stats.asc('all'));
    f *= m('Matriz Espiritual', 1 + 0.05 * P.matrizNv);
    f *= m('Rios do Dao', 1 + 0.05 * Stats.somaRios());
    f *= m('Tribulações de Morte vencidas', 1 + P.qiBonus);
    f *= m('Elixires permanentes', P.permQi);
    if (P.ferido > 0) f *= m('Ferido', 0.5);
    if (Stats.idade() > Stats.vidaMax()) f *= m('Declínio da velhice', 0.1);
    if (Eventos.e === 'chuva') f *= m('Chuva Espiritual', 2);
    if (P.titulo === 'discipulo') f *= m('Título: Discípulo Dedicado', 1.05);
    if (P.titulo === 'eremita' && typeof Reclusao !== 'undefined' && Reclusao.ativa) f *= m('Título: Eremita da Montanha', 1.1);
    if (!Jogo.eu.sent && !(typeof Reclusao !== 'undefined' && Reclusao.ativa)) f *= m('Sem meditar (25%)', 0.25);
    return detalhe ? { f, L } : f;
  },
  // Qi por segundo (log10)
  // velocidade da raiz: divide o tempo de cada estágio
  raiz() { return Math.pow(DESTINOS[P.destino].mult, 0.7) * P.aptidao; },
  qiS() { return Curva.E(P.passo) - Curva.T(P.passo) + Math.log10(Stats.raiz() * Stats.F()); },
  // segundos reais para encher um estágio do zero, nas condições de agora
  tEstagio() { return Math.pow(10, Curva.E(P.passo) - Stats.qiS()); },
  chanceRomper() { const fe = Formacao.ativa('estabelecimento'); return Math.min(1, 0.35 + 0.13 * P.base + (P.avanco || 0) + (fe ? fe.efv * 0.1 : 0)); },
  // itens de grau mais baixo que o seu nível valem menos
  efic(L) { const d = Stats.nivelL() - L; return d <= 0 ? 1 : Math.max(0.1, 1 - 0.25 * d); },
  eqMult(k) { let v = 1; for (const s in P.eq) { const e = P.equips.find((x) => x.uid === P.eq[s]); if (e && e.b[k]) v *= 1 + e.b[k] * (1 + 0.1 * e.ref); } return v; },
  eqSoma(k) { let v = 0; for (const s in P.eq) { const e = P.equips.find((x) => x.uid === P.eq[s]); if (e && e.b[k]) v += e.b[k]; } return v; },
  buff(ef) { let v = 1; for (const b of P.buffs) if (b.ef === ef) v *= b.val; return v; },
  buffSoma(ef) { let v = 0; for (const b of P.buffs) if (b.ef === ef) v += b.val; return v; },
  asc(k) { let v = 0; for (const i of P.ascItens || []) { const it = ASC_ITENS[i]; if (it.bonus === k) v += it.val; } return v; },
  somaRios() { let v = 0; for (const k in P.rios) v += P.rios[k]; return v; },
  ativo(cat) { const id = P.ativos[cat]; return id !== undefined && id !== null ? MANUAIS[id] : null; },
  maestria(id) { return MAESTRIA_MULT[(P.man[id] || {}).m || 0]; },
  // ---------- combate (log10) ----------
  C: () => Curva.C(P.passo),
  hpMax() {
    let f = (1 + 0.08 * P.corpo) * (1 + 0.1 * P.alma);
    const cm = Stats.ativo('corpo'); if (cm) f *= 1 + cm.hp * Stats.maestria(cm.id) * Stats.efic(cm.L);
    let mh = 1; for (const i of P.merid) if (MERIDIANOS[i].bonus === 'hp') mh += MERIDIANOS[i].val; f *= mh;
    f *= Stats.eqMult('hp') * Stats.eqMult('all') * Stats.buff('all');
    const fv = Formacao.ativa('vida'); if (fv) f *= 1 + fv.efv * 0.5;
    if (P.pet && PETS[P.pet.id].bonus === 'all') f *= 1.2 + 0.03 * P.pet.nv;
    f *= 1 + Stats.asc('hp') + Stats.asc('all'); if (P.titulo === 'imortal') f *= 1.1;
    f *= (1 + 0.1 * (P.aspectos[5] || 0)) * (1 + 0.04 * Stats.somaRios());
    return Stats.C() + 1.0 + Math.log10(f);
  },
  atk() {
    let f = (1 + 0.03 * P.corpo + 0.02 * P.alma) * Stats.eqMult('atk') * Stats.eqMult('all') * Stats.buff('all');
    f *= 1 + 0.3 * (P.aspectos[1] || 0); f *= 1 + 0.1 * (P.aspectos[5] || 0);
    if (P.pet && PETS[P.pet.id].bonus === 'atk') f *= 1.5 + 0.04 * P.pet.nv;
    if (P.pet && PETS[P.pet.id].bonus === 'all') f *= 1.2 + 0.03 * P.pet.nv;
    f *= 1 + 0.02 * (P.daoNv - 1); f *= 1 + 0.03 * Stats.somaRios(); f *= 1 + Stats.asc('atk') + Stats.asc('all'); if (P.titulo === 'cacador') f *= 1.08; if (P.titulo === 'lenda') f *= 1.06;
    const fa = Formacao.ativa('ataque'); if (fa) f *= 1 + fa.efv * 0.5;
    const sec = Stats.ativo('secreta'); if (sec && sec.sec === 'furia' && Jogo.hpFrac() < 0.35) f *= 1 + sec.val;
    return Stats.C() + Math.log10(f);
  },
  def() {
    let f = (1 + 0.04 * P.corpo) * Stats.eqMult('def') * Stats.eqMult('all') * (1 + Stats.buffSoma('def')) * (1 + 0.25 * (P.aspectos[2] || 0));
    const cm = Stats.ativo('corpo'); if (cm) f *= 1 + cm.def * Stats.maestria(cm.id);
    if (P.pet && PETS[P.pet.id].bonus === 'def') f *= 1.3 + 0.04 * P.pet.nv;
    f *= 1 + Stats.asc('def');
    return Stats.C() - 0.3 + Math.log10(f);
  },
  crit() { const am = Stats.ativo('alma'); return Math.min(0.75, 0.05 + 0.002 * P.alma + (am ? am.crit : 0) + Stats.eqSoma('crit') + Stats.buffSoma('crit')); },
  enMax() { const am = Stats.ativo('alma'); return Math.round(100 + 2 * P.alma + (am ? am.en : 0)); },
  vel() { const mv = Stats.ativo('movimento'), fv = Formacao.ativa('velocidade'); return 135 * (1 + (mv ? mv.vel * Stats.maestria(mv.id) : 0)) * (1 + Stats.buffSoma('speed')) * (fv ? 1 + Math.min(1.5, fv.efv * 0.3) : 1) * (P.titulo === 'vento' ? 1.08 : 1); },
  sorte() { let s = 1 + 0.4 * (P.aspectos[4] || 0) + Stats.buffSoma('luck'); for (const i of P.merid) if (MERIDIANOS[i].bonus === 'drop') s += MERIDIANOS[i].val; if (DESTINOS[P.destino].sorte) s *= 7; if (P.pet && PETS[P.pet.id].bonus === 'sorte') s += 0.4; const sec = Stats.ativo('secreta'); if (sec && sec.sec === 'sorte') s += sec.val; if (P.titulo === 'generoso') s += 0.1; return s; },
  expMult() { let e = 1 + 0.5 * (P.aspectos[3] || 0); for (const i of P.merid) if (MERIDIANOS[i].bonus === 'exp') e += MERIDIANOS[i].val; const am = Stats.ativo('alma'); if (am) e += am.exp; if (P.pet && PETS[P.pet.id].bonus === 'exp') e += 0.5; return e * Stats.buff('exp') * (Eventos.e === 'eclipse' ? 2 : 1) * (P.titulo === 'tempo' ? 1.15 : 1); },
  cp() { return Stats.atk() + 0.5 * Stats.def() + 0.5 * Stats.hpMax() - 0.5; },
  // ---------- idade ----------
  idade: () => (Tempo.cal - P.nasc) / MIN_ANO,
  vidaMax: () => RANKS[rankDe(P.passo)].vida * P.vidaMult,
  capCorpo: () => 10 + 10 * rankDe(P.passo),
  // refinar o corpo e a alma gasta uma fatia do Qi do estágio atual
  custoCorpo: (n) => Curva.E(P.passo) + Math.log10(0.06 + 0.002 * n),
  custoAlma: (n) => Curva.E(P.passo) + Math.log10(0.09 + 0.003 * n),
  reqRank(r) { return { corpo: 5 * (r + 1), alma: 3 * (r + 1) }; },
};

// ---------- carteira de pedras espirituais ----------
const Carteira = {
  // valor total em log10 (de Pedras Espirituais Inferiores)
  valor(min) { let v = N.Z; for (let k = min || 0; k < NIVEIS; k++) if (P.pedras[k] > 0) v = N.add(v, Math.log10(P.pedras[k]) + 2 * k); return v; },
  // paga um preço (log10 em pedras inferiores do reino do item); só aceita pedras do mesmo reino ou de cima
  pode(precoL, reinoMin) { return N.ge(Carteira.valor((reinoMin || 0) * 7), precoL); },
  pagar(precoL, reinoMin) {
    const k0 = (reinoMin || 0) * 7;
    if (!Carteira.pode(precoL, reinoMin)) return false;
    let falta = precoL;
    for (let k = k0; k < NIVEIS && falta > N.Z; k++) {
      if (P.pedras[k] <= 0) continue;
      const vk = Math.log10(P.pedras[k]) + 2 * k;
      if (N.ge(falta, vk)) { falta = N.sub(falta, vk); P.pedras[k] = 0; }
      else { const usa = Math.ceil(Math.pow(10, falta - 2 * k) - 1e-9); P.pedras[k] -= usa; const sobra = N.sub(Math.log10(usa) + 2 * k, falta); falta = N.Z; Carteira.troco(sobra, k); }
    }
    return true;
  },
  // devolve troco em pedras de graus abaixo de k
  troco(vL, k) { for (let j = k - 1; j >= 0 && vL > N.Z; j--) { const n = Math.floor(Math.pow(10, vL - 2 * j) + 1e-9); if (n >= 1) { P.pedras[j] += n; vL = N.sub(vL, Math.log10(n) + 2 * j); } } },
  dar(k, n) { P.pedras[k] = (P.pedras[k] || 0) + n; },
  resumo() { const out = []; for (let k = NIVEIS - 1; k >= 0 && out.length < 3; k--) if (P.pedras[k] >= 1) out.push([k, P.pedras[k]]); return out; },
  // preço de um item em log10, com o reino mínimo das pedras aceitas
  preco: (L, extra) => [2 * L + (extra || 0), reinoL(L)],
};

// ---------- o personagem no mapa ----------
const Jogo = {
  P: null,
  eu: { x: 0, y: 0, vx: 0, vy: 0, fx: 0, fy: 1, anda: false, walkT: 0, sent: false, golpe: 0, voo: false },
  pet: null,
  look() {
    const l = P.look, S = SEITAS[P.seita.id];
    return { pele: l.pele, cab: l.cab, est: l.est, F: P.sexo === 'F', r1: l.r1 || S.cor, r2: l.r2 || '#f4f0e4', faixa: l.faixa || S.teto, ferr: l.ferr === undefined ? 'espada' : l.ferr || undefined, chapeu: l.chapeu || (P.passo >= 100 ? 'coque' : undefined), barba: P.sexo === 'M' && l.barba ? 1 : 0, sCor: l.sCor || '#c03a2a' };
  },
  voando: () => Jogo.eu.voo && rankDe(P.passo) >= 2,
  hpFrac: () => N.frac(P.hp, Stats.hpMax()),
  // ---------- entrada no mundo ----------
  entrar(reino) {
    const t = performance.now();
    if (Mundo.reino !== reino || Mundo.inst) Mundo.gerar(reino); P.reino = reino; Render.reset();
    const sp = P.pos && P.pos.reino === reino ? P.pos : { x: (Mundo.spawn[0] + 0.5) * TILE, y: (Mundo.spawn[1] + 0.5) * TILE };
    Jogo.eu.x = sp.x; Jogo.eu.y = sp.y;
    if (!Mundo.livre(Math.floor(sp.x / TILE), Math.floor(sp.y / TILE))) { Jogo.eu.x = (Mundo.spawn[0] + 0.5) * TILE; Jogo.eu.y = (Mundo.spawn[1] + 0.5) * TILE; }
    Render.cam.x = Jogo.eu.x; Render.cam.y = Jogo.eu.y;
    if (P.pet) Jogo.pet = Object.assign({ x: Jogo.eu.x - 20, y: Jogo.eu.y, fx: 1, walkT: 0 }, { forma: PETS[P.pet.id].forma, cor: PETS[P.pet.id].cor, cor2: Art.sh(PETS[P.pet.id].cor, -0.4) });
    if (typeof Combate !== 'undefined') Combate.limpar();
    return Math.round(performance.now() - t);
  },
  // local de cultivo onde o jogador está (raio de 3 blocos)
  localAqui() {
    const tx = Jogo.eu.x / TILE, ty = Jogo.eu.y / TILE;
    for (const p of Mundo.pois) {
      if ((p.tipo === 'local' || p.tipo === 'local_seita') && Math.hypot(p.x + 0.5 - tx, p.y + 0.5 - ty) < 3.2) {
        if (p.tipo === 'local') return Object.assign({}, LOCAIS[p.ref], { poi: p });
        return { id: 'seita' + p.reg, nome: p.nome, f: p.f, el: null, poi: p };
      }
    }
    const fm = Formacao.ativa('cultivo'); if (fm) return { id: 'mat' + fm.b.uid, nome: fm.m.nome + ' (sua)', f: 1, el: fm.m.el, matriz: fm.b };
    return null;
  },
  regiao() { const r = Mundo.regAt(Jogo.eu.x, Jogo.eu.y); return r >= 0 ? REGIOES[r] : null; },
  // ---------- movimento ----------
  mover(dt, ix, iy, correr) {
    const e = Jogo.eu;
    if (e.sent && (ix || iy)) Jogo.meditar(false);
    const vmax = Stats.vel() * (Jogo.voando() ? 1.45 : 1) * (correr ? 1.3 : 1);
    const ax = ix * vmax, ay = iy * vmax, k = 1 - Math.exp(-dt * 18);
    e.vx += (ax - e.vx) * k; e.vy += (ay - e.vy) * k;
    if (!ix && !iy && Math.hypot(e.vx, e.vy) < 8) { e.vx = 0; e.vy = 0; }
    const nx = e.x + e.vx * dt, ny = e.y + e.vy * dt;
    if (Jogo.passa(nx, e.y)) e.x = nx; else e.vx = 0;
    if (Jogo.passa(e.x, ny)) e.y = ny; else e.vy = 0;
    const sp = Math.hypot(e.vx, e.vy);
    e.anda = sp > 10; if (e.anda) { e.walkT += sp * dt * 0.12; if (Math.abs(ix) + Math.abs(iy) > 0) { e.fx = ix; e.fy = iy; } }
    // pet segue
    if (Jogo.pet) { const p = Jogo.pet, dx = e.x - 26 * (e.fx || 1) - p.x, dy = e.y - 6 - p.y, d = Math.hypot(dx, dy); p.anda = d > 6; if (d > 400) { p.x = e.x; p.y = e.y; } else if (d > 6) { const v = Math.min(d * 4, vmax * 1.1) * dt; p.x += dx / d * v; p.y += dy / d * v; p.walkT += v * 0.3; p.fx = dx < 0 ? -1 : 1; } }
  },
  passa(x, y) {
    const r = 5;
    for (const [ox, oy] of [[-r, 0], [r, 0], [0, -2], [0, 3]]) {
      const tx = Math.floor((x + ox) / TILE), ty = Math.floor((y + oy) / TILE);
      if (!Mundo.inb(tx, ty)) return false;
      const i = ty * Mundo.W + tx;

const Salvar = (() => {
  const BD = 'DaoEterno2D', LOJA = 'contas', PRE = 'dao2d:';

    return new Promise((ok) => {
      try {
        const rq = indexedDB.open(BD, 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore(LOJA, { keyPath: 'nome' });
        rq.onsuccess = () => { db = rq.result; ok(true); };
        rq.onerror = rq.onblocked = () => ok(false);
        setTimeout(() => ok(!!db), 2500);
      } catch (e) { ok(false); }
    });
  }
  function doLocal(k) { try { const s = localStorage.getItem(PRE + k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function ler(nome) {
    const k = chave(nome);
    return new Promise((ok) => {
      if (!db) return ok(doLocal(k));
      try {
        const rq = db.transaction(LOJA).objectStore(LOJA).get(k);
        rq.onsuccess = () => { const a = rq.result || null, b = doLocal(k); ok(a && b ? ((a.ultimo || 0) >= (b.ultimo || 0) ? a : b) : a || b); };
        rq.onerror = () => ok(doLocal(k));
      } catch (e) { ok(doLocal(k)); }
    });
  }
  function gravar(reg) {
    try { localStorage.setItem(PRE + reg.nome, JSON.stringify(reg)); } catch (e) { /* cheio: fica só no IndexedDB */ }
    return new Promise((ok) => {
      if (!db) return ok();
      try { const tx = db.transaction(LOJA, 'readwrite'); tx.objectStore(LOJA).put(reg); tx.oncomplete = () => ok(); tx.onerror = () => ok(); } catch (e) { ok(); }
    });
  }
  function lista() {
    return new Promise((ok) => {
      const out = new Map();
      try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PRE)) { const r = doLocal(k.slice(PRE.length)); if (r) out.set(r.nome, r); } } } catch (e) { /* sem localStorage */ }
      const fim = () => ok([...out.values()].sort((a, b) => (b.ultimo || 0) - (a.ultimo || 0)));
      if (!db) return fim();
      try { const rq = db.transaction(LOJA).objectStore(LOJA).getAll(); rq.onsuccess = () => { for (const r of rq.result) if (!out.has(r.nome) || (r.ultimo || 0) > (out.get(r.nome).ultimo || 0)) out.set(r.nome, r); fim(); }; rq.onerror = fim; } catch (e) { fim(); }
    });
  }
  function agora() {
    if (!P || !conta || P.vitrine) return Promise.resolve();
    P.ultimo = Date.now(); P.tempo = Tempo.min; P.cal = Tempo.cal;
    if (Masmorra.ativa) P.pos = { reino: P.reino, x: Masmorra.ativa.volta.x, y: Masmorra.ativa.volta.y };
    else if (!Mundo.inst && Mundo.reino === P.reino) P.pos = { reino: Mundo.reino, x: Jogo.eu.x, y: Jogo.eu.y };
    return gravar({ nome: chave(conta.nome), exibe: conta.nome, senha: conta.senha, dados: enc(P), resumo: { nome: P.nome, passo: P.passo, reino: P.reino }, ultimo: Date.now() });
  }
  return { abrir, ler, lista, agora, enc, dec, chave, get conta() { return conta; }, set conta(c) { conta = c; } };
})();

// ---------- controles ----------
const Input = (() => {
  const teclas = new Set(), joy = { x: 0, y: 0, id: null, ox: 0, oy: 0 };
  let segura = false, mouse = null;
  function vetor() {
    let x = 0, y = 0;
    if (teclas.has('KeyA') || teclas.has('ArrowLeft')) x -= 1;
    if (teclas.has('KeyD') || teclas.has('ArrowRight')) x += 1;
    if (teclas.has('KeyW') || teclas.has('ArrowUp')) y -= 1;
    if (teclas.has('KeyS') || teclas.has('ArrowDown')) y += 1;
    if (joy.id !== null) { x = joy.x; y = joy.y; }
    const n = Math.hypot(x, y); if (n > 1) { x /= n; y /= n; }
    return [x, y, teclas.has('ShiftLeft') || teclas.has('ShiftRight') || Math.hypot(joy.x, joy.y) > 0.92];
  }
  function mirarTela(sx, sy) { const [wx, wy] = Render.mundo(sx, sy), eu = Jogo.eu, d = Math.hypot(wx - eu.x, wy - eu.y + 12) || 1; eu.fx = (wx - eu.x) / d; eu.fy = (wy - eu.y + 12) / d; }
  const ATALHO = {
    KeyJ: () => Combate.atacar(), KeyK: () => Combate.esquivar(), Space: () => Combate.esquivar(), KeyQ: () => Combate.usarHab(7),
    KeyE: () => UI.interagir(), KeyF: () => Jogo.meditar(!Jogo.eu.sent), KeyG: () => { Jogo.condensar(); UI.flutua('⚡ Condensar'); }, KeyR: () => { if (estagioDe(P.passo) >= 9) UI.cultivo('reino'); else Jogo.avancarEstagio(); },
    KeyH: () => $('#bCura').click(), KeyV: () => Main.voar(),
  };
  const PAINEIS = { KeyC: 'cultivo', KeyB: 'bolsa', KeyI: 'bolsa', KeyN: 'artes', KeyL: 'missoes', KeyM: 'mapa', KeyO: 'online' };
  function init(cv) {
    addEventListener('keydown', (e) => {
      if (!Main.jogando) return;
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
      teclas.add(e.code);
      if (e.repeat) return;
      if (e.code === 'Escape') { if (UI.aberto) UI.fechar(); return; }
      if (PAINEIS[e.code]) { if (UI.aberto && UI.ultimo === PAINEIS[e.code]) UI.fechar(); else UI[PAINEIS[e.code]](); return; }
      if (/^Digit[1-7]$/.test(e.code)) { Combate.usarHab(+e.code.slice(5) - 1); return; }
      if (ATALHO[e.code]) ATALHO[e.code]();
    });
    addEventListener('keyup', (e) => teclas.delete(e.code));
    addEventListener('blur', () => teclas.clear());
    // mouse: clique ataca na direção do cursor; roda dá zoom
    cv.addEventListener('mousedown', (e) => { if (!Main.jogando || e.button !== 0) return; mouse = [e.clientX, e.clientY]; mirarTela(e.clientX, e.clientY); Combate.atacar(); });
    addEventListener('mousemove', (e) => { if (mouse) mouse = [e.clientX, e.clientY]; });
    addEventListener('mouseup', () => { mouse = null; });
    // segurar o botão de ataque (ou J, ou o clique) continua atacando
    const bA = $('#bAtk'); bA.addEventListener('pointerdown', () => { segura = true; Combate.atacar(); });
    for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) bA.addEventListener(ev, () => { segura = false; });
    cv.addEventListener('wheel', (e) => { if (!Main.jogando) return; e.preventDefault(); Render.cam.manual = true; Render.cam.alvoZ = clamp(Render.cam.alvoZ * (e.deltaY > 0 ? 0.9 : 1.1), 1.1, 4.2); }, { passive: false });
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    // toque: metade esquerda = joystick; metade direita = ataque mirado
    const base = $('#joy'), bola = base.querySelector('i');
    const solta = () => { joy.id = null; joy.x = joy.y = 0; base.classList.remove('on'); bola.style.transform = ''; };
    cv.addEventListener('touchstart', (e) => {
      if (!Main.jogando) return; e.preventDefault();
      for (const t of e.changedTouches) {
        const invis = P && P.cfg && P.cfg.joyInvis;
        if ((invis || t.clientX < innerWidth * 0.5) && joy.id === null) { joy.id = t.identifier; joy.ox = t.clientX; joy.oy = t.clientY; base.style.left = t.clientX + 'px'; base.style.top = t.clientY + 'px'; base.classList.toggle('on', !invis); }
        else if (!invis && t.clientX >= innerWidth * 0.5) { mirarTela(t.clientX, t.clientY); Combate.atacar(); }
      }
    }, { passive: false });
    cv.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) if (t.identifier === joy.id) {
        let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy; const d = Math.hypot(dx, dy), R0 = 46;
        // analógico flutuante: se o dedo passa do limite, a base vem atrás (sem "travar")
        if (d > R0) { joy.ox += dx - dx / d * R0; joy.oy += dy - dy / d * R0; dx = dx / d * R0; dy = dy / d * R0; base.style.left = joy.ox + 'px'; base.style.top = joy.oy + 'px'; }
        joy.x = dx / R0; joy.y = dy / R0; const m = Math.hypot(joy.x, joy.y); if (m < 0.1) joy.x = joy.y = 0; else { const k = Math.min(1, (m - 0.1) / 0.8) / m; joy.x *= k; joy.y *= k; }
        bola.style.transform = `translate(${dx}px,${dy}px)`;
      }
    }, { passive: false });
    const fim = (e) => { for (const t of e.changedTouches) if (t.identifier === joy.id) solta(); };
    cv.addEventListener('touchend', fim); cv.addEventListener('touchcancel', fim);
  }
  function continuo() {
    if (UI.aberto && !mouse && !segura) return;
    if (mouse) { mirarTela(mouse[0], mouse[1]); Combate.atacar(); } else if (segura || teclas.has('KeyJ')) Combate.atacar();
  }
  return { init, vetor, continuo, teclas };
})();

    if (d.cal === undefined) { const idade = Math.max(18, ((d.tempo || 0) - (d.nasc || 0)) / MIN_ANO); d.cal = 0; d.nasc = -idade * MIN_ANO; }
    d.construidas = d.construidas || [];
    return d;
  }
  function iniciar(dados, novo) {
    P = migrar(dados); delete P.vitrine;
    Fmt.modo = (P.cfg && P.cfg.notacao) || 'abrev';
    Tempo.min = P.tempo || Tempo.min; Tempo.cal = P.cal || 0;
    $('#telaLogin').classList.add('hid'); $('#telaCriar').classList.add('hid'); $('#hud').classList.remove('hid');
    Render.cam.manual = false; Render.cam.dx = Render.cam.dy = 0; Render.cam.alvoZ = Math.min(innerWidth, innerHeight) < 600 ? 1.75 : 2.3;
    Jogo.eu.sent = false; Jogo.pet = null;
    Jogo.entrar(P.reino);
    jogando = true; salvarT = 30;
    nevoa(true);
    if (novo) {
      // primeiro presente da seita: uma técnica marcial básica
      Saber.aprender(181); P.hp = Stats.hpMax();
      UI.log('🌅 Você tem 18 anos. ' + DESTINOS[P.destino].nome + ', raiz de ' + ELEM[P.el].nome + '.', 'divine');
      UI.dialogo('🌄 O Pergaminho Sem Nome', 'Você acorda no pátio da Seita Nuvem Celeste, na Província da Aurora, com 18 anos e um pergaminho que ninguém consegue ler. O Ancião da Seita quer falar com você.', 'Ande com WASD ou o joystick. Chegue perto do Ancião (siga a seta dourada) e aperte E ou o botão de falar.');
      Missoes.iniciarPasso();
      Salvar.agora();
    } else {
      const fora = (Date.now() - (P.ultimo || Date.now())) / 1000, t = Jogo.offline(fora);
      UI.log('🌄 Bem-vindo de volta, ' + P.nome + '.', 'sys');
      if (t) UI.dialogo('🌙 De volta ao mundo', t, 'Ganhos offline: 50% do cultivo, por até 8 horas. A idade só passa com você jogando ou em reclusão.');
      if (P.miss.base === undefined) Missoes.iniciarPasso();
    }
  }
  // espada voadora
  function voar() {
    if (rankDe(P.passo) < 2) { UI.toast('Voar na espada exige Fundação de Jade.'); return; }
    if (Mundo.inst) { UI.toast('Não há espaço para voar aqui.'); return; }
    Jogo.eu.voo = !Jogo.eu.voo; if (Jogo.eu.voo && Jogo.eu.sent) Jogo.meditar(false);
    UI.flutua(Jogo.eu.voo ? '🗡️ Voando' : 'Pousou');
  }
  // névoa do mapa: marca o que já foi visto
  function nevoa(forte) {
    if (Mundo.inst || !P || P.vitrine) return;
    const f = P.mundo[Mundo.reino].fog, cx = Math.floor(Jogo.eu.x / TILE / 8), cy = Math.floor(Jogo.eu.y / TILE / 8), r = forte ? 5 : 3;
    for (let j = -r; j <= r; j++) for (let i = -r - 1; i <= r + 1; i++) if ((i * i) / ((r + 1) * (r + 1)) + (j * j) / (r * r) <= 1.05) f[(cx + i) + ',' + (cy + j)] = 1;
  }
  // marcadores de missão e a caravana, desenhados no mundo
  function marcadores(cx, ox, oy, z, now) {
    if (!jogando || Mundo.inst) return;
    for (const a of Missoes.alvos()) {
      if (a.area) continue;
      const sx = ((a.x + (a.car ? 0 : 0.5)) * TILE - ox) * z, sy = ((a.y + (a.car ? 0 : 0.5)) * TILE - oy) * z;
      if (sx < -60 || sy < -200 || sx > cx.canvas.width + 60 || sy > cx.canvas.height + 60) continue;
      if (a.car) { const m = P.miss.ativas.find((m) => m.car && Math.abs(m.car.x / TILE - a.x) < 0.01), u = Math.max(2, Math.round(2 * z / 2)); cx.fillStyle = '#5a3a1e'; cx.fillRect(sx - 14 * z, sy - 14 * z, 28 * z, 12 * z); cx.fillStyle = '#c8a060'; cx.fillRect(sx - 13 * z, sy - 13 * z, 26 * z, 4 * z); cx.fillStyle = '#d04a3a'; cx.fillRect(sx - 10 * z, sy - 22 * z, 20 * z, 8 * z); cx.fillStyle = '#2a1a10'; for (const dx of [-9, 9]) cx.fillRect(sx + dx * z - 3 * z, sy - 4 * z, 6 * z, 6 * z); if (m) { cx.fillStyle = 'rgba(0,0,0,.6)'; cx.fillRect(sx - 15 * z, sy - 28 * z, 30 * z, 3 * z); cx.fillStyle = '#5fd068'; cx.fillRect(sx - 15 * z, sy - 28 * z, 30 * z * Math.max(0, m.car.hp), 3 * z); } void u; continue; }
      const p = 0.5 + 0.5 * Math.sin(now / 300), cor = a.h ? '255,208,64' : '127,227,255';
      const gr = cx.createLinearGradient(0, sy - 140 * z, 0, sy); gr.addColorStop(0, `rgba(${cor},0)`); gr.addColorStop(1, `rgba(${cor},${0.25 + 0.2 * p})`);
      cx.fillStyle = gr; cx.fillRect(sx - 5 * z, sy - 140 * z, 10 * z, 140 * z);
      cx.fillStyle = `rgba(${cor},0.95)`; const s = (5 + 2 * p) * z; cx.beginPath(); cx.moveTo(sx, sy - 34 * z - s); cx.lineTo(sx + s, sy - 34 * z); cx.lineTo(sx, sy - 34 * z + s); cx.lineTo(sx - s, sy - 34 * z); cx.closePath(); cx.fill();
    }
  }
  // o outro corpo (original meditando, ou o clone parado)
  function corpos(cx, ox, oy, z, now) {
    if (!jogando || Mundo.inst || !P) return;
    const o = P.original ? { x: P.original.x, y: P.original.y, reino: P.original.reino, sent: true } : P.clone ? { x: P.clone.x, y: P.clone.y, reino: P.clone.reino, sent: false } : null;
    if (!o || o.reino !== Mundo.reino) return;
    const sx = (o.x - ox) * z, sy = (o.y - oy) * z; if (sx < -80 || sy < -80 || sx > cx.canvas.width + 80 || sy > cx.canvas.height + 120) return;
    if (o.sent) { cx.globalAlpha = 0.16 + 0.08 * Math.sin(now / 300); cx.fillStyle = ELEM[P.el].cor; cx.beginPath(); cx.ellipse(sx, sy - 10 * z, 15 * z, 18 * z, 0, 0, 6.283); cx.fill(); }
    cx.globalAlpha = o.sent ? 1 : 0.75; const sp = Sprites.pessoa(Jogo.look()), [d, f] = Sprites.quadroDe({ fy: 1, sent: o.sent }, now);
    cx.drawImage(sp.c, f * sp.FW, d * sp.FH, sp.FW, sp.FH, Math.round(sx - 12 * z), Math.round(sy - 28 * z), Math.round(sp.FW * z), Math.round(sp.FH * z)); cx.globalAlpha = 1;
    cx.font = `bold ${Math.round(10 * Render.dpr)}px Georgia, serif`; cx.textAlign = 'center'; cx.fillStyle = '#ffd36a'; cx.fillText(o.sent ? 'Corpo original' : 'Clone', sx, sy - 34 * z);
  }
  // ---------- laço ----------
  let ult = performance.now();
  function laco(now) {
    const dt = Math.min(0.1, (now - ult) / 1000); ult = now;
    try {
      if (jogando && P) {
        if (Reclusao.ativa) { Reclusao.tick(dt); Jogo.eu.sent = true; }
        else if (!editando) {
          const [ix, iy, correr] = Input.vetor();
          Jogo.mover(dt, ix, iy, correr); Input.continuo();
          Combate.update(dt); Masmorra.tick(dt); Missoes.tick(dt); Combate.tickMundial(dt); Encontros.tick(dt); Eventos.tick(dt);
        }
        Tempo.passo(dt);
        acc += dt; if (acc >= 0.25) { Jogo.tick(acc); Saber.tick(acc); Dao.tick(acc); acc = 0; }
        Rede.tick(dt);
        seg += dt; if (seg >= 1) { seg = 0; Conquistas.checar(); Seita.checar(); nevoa(false); Chao.tick(); }
        salvarT -= dt; if (salvarT <= 0) { salvarT = 30; Salvar.agora(); }
        UI.tick(dt);
      }
      VFX.update(dt);
      Render.frame(now);
    } catch (e) { console.error(e); if (!laco._erro) { laco._erro = 1; UI.toast('Erro: ' + e.message); } }
    requestAnimationFrame(laco);
  }
  async function boot() {
    const cv = $('#jogo');
    Render.init(cv);
    Render.camadas.push(corpos, (cx, ox, oy, z, now) => Chao.desenhar(cx, ox, oy, z, now), (cx, ox, oy, z, now) => Rede.desenhar(cx, ox, oy, z, now), (cx, ox, oy, z, now, dpr) => Combate.desenhar(cx, ox, oy, z, now, dpr), (cx, ox, oy, z) => VFX.desenhar(cx, ox, oy, z), marcadores);
    UI.init(); Input.init(cv);
    $('#bVoo').onclick = voar;
    vitrine();
    requestAnimationFrame(laco);
    await Salvar.abrir();
    telaLogin();
    $('#lEntrar').onclick = entrar;
    $('#lSenha').onkeydown = (e) => { if (e.key === 'Enter') entrar(); };
    $('#lNome').onkeydown = (e) => { if (e.key === 'Enter') $('#lSenha').focus(); };
    $('#cDespertar').onclick = despertar;
    $('#cVoltar').onclick = () => { if (editando) return fimAparencia(false); enquadrar(Math.min(innerWidth, innerHeight) < 600 ? 2.6 : 3.2); Jogo.eu.sent = true; telaLogin(); };
    // salvar ao sair; ganhos ao voltar de outra aba
    document.addEventListener('visibilitychange', () => {
      if (!jogando || !P) return;
      if (document.hidden) { escondidoEm = Date.now(); Salvar.agora(); }
      else if (escondidoEm) { const s = (Date.now() - escondidoEm) / 1000; escondidoEm = 0; const t = Jogo.offline(s); if (t) UI.dialogo('🌙 De volta', t, ''); }
    });
    addEventListener('pagehide', () => { if (jogando) Salvar.agora(); });
  }
  return { boot, voar, aparencia, get jogando() { return jogando; }, conta: () => (Salvar.conta ? Salvar.conta.nome : '') };
})();
Main.boot();
</script>
